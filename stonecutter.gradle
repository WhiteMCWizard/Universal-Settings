plugins {
    id 'dev.kikugie.stonecutter'
    // Loader toolchain plugins are declared on the root classpath so the branch
    // buildscripts can apply them without a version.
    id 'net.fabricmc.fabric-loom' version '1.15.5' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.15.5' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.141' apply false
}

stonecutter.active '26.2' /* [SC] DO NOT EDIT */

// Builds every registered version of every branch.
tasks.register('buildAll') {
    group = 'stonecutter'
    dependsOn stonecutter.tasks.named('build') { true }
}
