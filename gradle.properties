# Fields used in mod metadata must be in the expandProps map of
# buildSrc/src/main/groovy/multiloader-common.gradle. Version-specific fields
# (minecraft/loader/API versions) live in versions/{version}/gradle.properties.

# Project
# Independent of the Minecraft version: one mod version is built for every
# registered game version (jar names carry both).
version=0.1.0
group=nl.whitemcwizard.universalsettings

# Common
mod_name=UniversalSettings
mod_author=WhiteMCWizard
mod_id=universalsettings
license=MIT
credits=
description=A mod that syncs your settings across different instances, versions and computers.

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_loader_version=0.18.6

# Stonecutter
dev.kikugie.stonecutter.hard_mode=true

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
