# Per-version properties for Minecraft 1.21.1, shared by all branches.
java_version=21
minecraft_version=1.21.1
# Compatibility window per the Stonecutter gates: [1.21, 1.21.2) (list rework in 1.21.2).
minecraft_version_range_neoforge=[1.21, 1.21.2)
minecraft_version_range_fabric=>=1.21 <1.21.2
# NeoForm (https://projects.neoforged.net/neoforged/neoform)
neo_form_version=1.21.1-20240808.144430

# Fabric (https://fabricmc.net/develop/)
fabric_version=0.116.12+1.21.1
modmenu_version=11.0.4

# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
neoforge_version=21.1.233
# Runtime dependency floor: 21.0.x is the NeoForge line for MC 1.21, which this
# build also supports (the minecraft dependency bounds the upper end).
neoforge_version_range=[21.0,)
neoforge_loader_version_range=[4,)

# Resources
pack_format=34
# min_format/max_format only exist in the 26.1+ pack metadata format
pack_format_range_line=
mixin_java_level=JAVA_21

# Mixin refmap reference; empty except where a branch overrides it (SRG 1.20.1)
mixin_refmap_line=
