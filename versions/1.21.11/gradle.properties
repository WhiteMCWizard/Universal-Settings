# Per-version properties for Minecraft 1.21.11, shared by all branches.
java_version=21
minecraft_version=1.21.11
# Compatibility window per the Stonecutter gates: 1.21.9–1.21.11 (1.21.11 is the
# last 1.x version; the GUI rendering rework lands in 26.1).
minecraft_version_range_neoforge=[1.21.9, 1.21.12)
minecraft_version_range_fabric=>=1.21.9 <1.21.12
# NeoForm (https://projects.neoforged.net/neoforged/neoform)
neo_form_version=1.21.11-20251209.172050

# Fabric (https://fabricmc.net/develop/)
fabric_version=0.141.4+1.21.11
modmenu_version=17.0.0

# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
neoforge_version=21.11.42
# Runtime dependency floor: 21.9.x is the NeoForge line for MC 1.21.9, the oldest
# version this build supports (the minecraft dependency bounds the upper end).
neoforge_version_range=[21.9,)
neoforge_loader_version_range=[4,)

# Resources
pack_format=75
# 1.21.9+ uses the post-64 "minor" pack format (75), whose metadata validator
# requires min_format/max_format — without them MC refuses to load the pack
# (logs "Couldn't load universalsettings pack metadata"). min 65 covers every
# post-64 format; max 75 ("75.*") spans the 1.21.9–1.21.11 window. The minecraft
# dependency range is the real compatibility gate.
pack_format_range_line=, "min_format": 65, "max_format": 75
mixin_java_level=JAVA_21

# Mixin refmap reference; empty except where a branch overrides it (SRG 1.20.1)
mixin_refmap_line=
