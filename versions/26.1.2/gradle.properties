# Per-version properties for Minecraft 26.1.2, shared by all branches.
java_version=25
minecraft_version=26.1.2
# Compatibility window per the Stonecutter gates: the whole 26.1 patch line.
minecraft_version_range_neoforge=[26.1, 26.2)
minecraft_version_range_fabric=>=26.1 <26.2
# NeoForm (https://projects.neoforged.net/neoforged/neoform)
neo_form_version=26.1.2-1

# Fabric (https://fabricmc.net/develop/)
fabric_version=0.145.4+26.1.2
modmenu_version=20.0.0-alpha.1

# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
neoforge_version=26.1.2.7-beta
# Runtime dependency floor: accept the whole 26.1 NeoForge line (26.1.0.x-beta on
# MC 26.1 etc.); the minecraft dependency bounds the upper end.
neoforge_version_range=[26.1,)
neoforge_loader_version_range=[4,)

# Resources
pack_format=84
# 26.1's pack metadata validator requires min_format/max_format once pack_format
# exceeds 64 (the last pre-minor client format) — without them, NeoForge 26.1.0/.1
# crash parsing the jar's pack.mcmeta. min 65 covers every post-64 format (the
# mod's minecraft dependency range is the real compatibility gate); a bare max of
# 84 means "84.*" (the minor defaults to unbounded).
pack_format_range_line=, "min_format": 65, "max_format": 84
mixin_java_level=JAVA_21

# Mixin refmap reference; empty except where a branch overrides it (SRG 1.20.1)
mixin_refmap_line=
