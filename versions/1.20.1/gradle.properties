# Per-version properties for Minecraft 1.20.1, shared by all branches.
java_version=17
minecraft_version=1.20.1
# Compatibility window per the Stonecutter gates: pre-1.20.2 APIs (toast ids change there).
# Floor is 1.20.1, not 1.20: NeoForge/Forge have no 1.20.0 build (this node targets
# net.neoforged:forge:1.20.1-*), so advertising 1.20 makes the loader claim a version
# that can't actually load. Fabric does ship 1.20, so its range keeps the wider floor.
minecraft_version_range_neoforge=[1.20.1, 1.20.2)
minecraft_version_range_fabric=>=1.20 <1.20.2
# NeoForm only exists for 1.20.2+; this flag routes the common and neoforge
# branches through ModDev's legacy (MCP/SRG) toolchain instead.
legacy_forge=true

# Fabric (https://fabricmc.net/develop/)
fabric_version=0.92.9+1.20.1
modmenu_version=7.2.2

# NeoForge 1.20.1 is still distributed as net.neoforged:forge and identifies as 'forge'
neoforge_version=1.20.1-47.1.106
# Unused at runtime (mods.toml depends on 'forge' via the loader range below);
# defined so the shared expandProps map resolves for this version too.
neoforge_version_range=[47,)
neoforge_loader_version_range=[47,)

# Resources
pack_format=15
# min_format/max_format only exist in the 26.1+ pack metadata format
pack_format_range_line=
mixin_java_level=JAVA_17

# Mixin refmap reference; empty except where a branch overrides it (SRG 1.20.1)
mixin_refmap_line=
