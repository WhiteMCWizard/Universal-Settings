# Per-version properties for Minecraft 26.2, shared by all branches.
java_version=25
minecraft_version=26.2
# Compatibility window per the Stonecutter gates: the whole 26.2 patch line.
minecraft_version_range_neoforge=[26.2, 26.3)
minecraft_version_range_fabric=>=26.2 <26.3
# NeoForm (https://projects.neoforged.net/neoforged/neoform)
neo_form_version=26.2-1

# Fabric (https://fabricmc.net/develop/)
fabric_version=0.152.1+26.2
modmenu_version=20.0.0-beta.2

# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
neoforge_version=26.2.0.0-beta
# Runtime dependency floor: accept the whole 26.2 NeoForge line; the minecraft
# dependency bounds the upper end. The floor carries the -beta qualifier on purpose:
# the only 26.2 build so far is 26.2.0.0-beta, and Maven sorts a -beta below the
# same-numbered release, so a bare [26.2,) (== [26.2.0.0,)) would reject it. The
# stable 26.2.0.0 and later patches sort above this, so they still match.
neoforge_version_range=[26.2.0.0-beta,)
neoforge_loader_version_range=[4,)

# Resources
pack_format=88
# 26.2's pack metadata validator requires min_format/max_format once pack_format
# exceeds 64 (the last pre-minor client format) — without them, NeoForge crashes
# parsing the jar's pack.mcmeta. min 65 covers every post-64 format (the mod's
# minecraft dependency range is the real compatibility gate); a bare max of 88
# means "88.*" (the minor defaults to unbounded).
pack_format_range_line=, "min_format": 65, "max_format": 88
mixin_java_level=JAVA_21

# Mixin refmap reference; empty except where a branch overrides it (SRG 1.20.1)
mixin_refmap_line=
